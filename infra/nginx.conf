worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_req_zone $binary_remote_addr zone=requests:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream webapp { server webapp:3000; }
    upstream tracking { server api:3001; }
    upstream redirects { server refer:3002; }

    server {
        listen 8080;
        server_name _;
        # Request error logs can contain invitation/query bearer tokens; keep only global process diagnostics.
        error_log /dev/null;
        limit_req zone=requests burst=40 nodelay;
        limit_conn connections 20;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;

        location = /healthz { access_log off; return 200 'ok'; }
        location ^~ /ingest { return 404; }
        location /assets/ {
            alias /srv/assets/;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control 'public, max-age=3600';
        }
        location /tracking/ { proxy_pass http://tracking/; }
        location /r/ { proxy_pass http://redirects/; }
        location / { proxy_pass http://webapp; }
    }
}
