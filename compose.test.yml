name: refref-test
services:
  database:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: refref-test-db
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 96
    environment:
      POSTGRES_DB: refref_test
      POSTGRES_USER: refref_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate .local/test.env}
    command: [postgres, -c, shared_buffers=16MB, -c, max_connections=20, -c, work_mem=1MB, -c, statement_timeout=10000]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=160m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=4m,uid=70,gid=70,mode=0770
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U refref_test -d refref_test']
      interval: 1s
      timeout: 3s
      retries: 30
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}
    networks: [isolated]
networks:
  isolated:
    name: refref-test
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
