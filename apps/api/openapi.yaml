openapi: 3.0.3
info:
  title: RefRef API
  description: >-
    Native RefRef tracking and referral first-payment API. Gateway adds /tracking prefix. V1 purchase remains
    major-unit; V2 is explicit minor-unit with immutable accepted terms. Event processing is not approval or payout. No
    automatic delivery/retry or refund accounting is promised.
  version: 0.1.0
  contact:
    name: RefRef Team
    url: https://github.com/refrefhq/refref
servers:
  - url: http://127.0.0.1:4310/tracking
    description: Local restricted gateway
  - url: http://refref-gateway:8080/tracking
    description: Optional private HTTP-only service network
paths:
  /:
    get:
      summary: Root health check
      description: Returns the health status of the API and its dependencies
      operationId: getRootHealth
      tags:
        - Health
      responses:
        "200":
          description: All services are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    ok: true
                    service: refref-api
                    checks:
                      api:
                        ok: true
                      database:
                        ok: true
        "503":
          description: One or more services are unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                unhealthy:
                  value:
                    ok: false
                    service: refref-api
                    checks:
                      api:
                        ok: true
                      database:
                        ok: false
                        error: connection refused
  /health:
    get:
      summary: Health check
      description: Returns the health status of the API and its dependencies
      operationId: getHealth
      tags:
        - Health
      responses:
        "200":
          description: All services are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    ok: true
                    service: refref-api
                    checks:
                      api:
                        ok: true
                      database:
                        ok: true
        "503":
          description: One or more services are unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                unhealthy:
                  value:
                    ok: false
                    service: refref-api
                    checks:
                      api:
                        ok: true
                      database:
                        ok: false
                        error: connection refused
  /v1/referrals/resolve:
    post:
      operationId: resolveReferralCode
      tags:
        - Tracking
      summary: resolveReferralCode
      description: >-
        Read-only business lookup. Normalizes trim/lowercase 3–32 ASCII letters/digits; health is reserved. No
        participant/referral/event/reward writes. Approved G1/G2 terms and verified native account ownership required;
        self-service participants must accept current published rules. No bank details are needed for code resolution.
        One response contains independent discount and frozen cash commission specs; no buyer PII.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        description: JSON only; maximum 256 KiB. No bank secrets or raw bank documents.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReferralRequest"
      responses:
        "200":
          description: Validated native result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCodeResolution"
        "400":
          description: Invalid body or contract version
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "401":
          description: API key required or invalid
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "403":
          description: Organization/product/program/operation scope denied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "404":
          description: Code not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "409":
          description: First-purchase, self-referral, or immutable order conflict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "413":
          description: Body exceeds 256 KiB
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "415":
          description: JSON content type required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "422":
          description: Inactive code or conditions/activation gates not satisfied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "429":
          description: Native service-key quota exceeded; Retry-After applies
          headers:
            Retry-After:
              description: Seconds before quota retry; caller must not auto-retry preview
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "500":
          description: Native unexpected server or serialization error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "503":
          description: Referral service unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
  /v1/track/purchase:
    post:
      operationId: trackPurchase
      tags:
        - Tracking
      summary: trackPurchase
      description: >-
        Existing purchase endpoint: V1 orderAmount is major units for unrelated legacy programs. V1 ignores unknown
        fields, including customer, without profile writes; V2 money fields cannot be mixed into V1.
        V2 orderAmountMinor is paid minor units and must match full snapshot. One native V2 transaction upserts the
        product/external-ID participant, updates required customer name/email, and records exact code attribution,
        event/first-paid claim and complete frozen rewards. Customer changes do not change V2 financial replay identity.
        Same product/order with changed
        owner/program/terms/time is 409; exact replay returns original IDs/results and duplicate=true even after
        archival. timestamp is original verified confirmation time, not retry time. Frozen rules are not live-rebuilt.
        ACK customerExternalId and codeId come from verified purchase/attribution associations.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        description: JSON only; maximum 256 KiB. No bank secrets or raw bank documents.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MinorPurchaseRequest"
                - $ref: "#/components/schemas/LegacyPurchaseRequest"
      responses:
        "200":
          description: Validated native result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MinorPurchaseResponse"
                  - $ref: "#/components/schemas/LegacyTrackingResponse"
        "400":
          description: Invalid body or contract version
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "401":
          description: API key required or invalid
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "403":
          description: Organization/product/program/operation scope denied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "404":
          description: Code not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "409":
          description: First-purchase, self-referral, or immutable order conflict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "413":
          description: Body exceeds 256 KiB
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "415":
          description: JSON content type required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "422":
          description: Inactive code or conditions/activation gates not satisfied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "429":
          description: Native service-key quota exceeded; Retry-After applies
          headers:
            Retry-After:
              description: Seconds before quota retry; caller must not auto-retry preview
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "500":
          description: Native unexpected server or serialization error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "503":
          description: Referral service unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
  /v1/track/signup:
    post:
      operationId: trackSignup
      tags:
        - Tracking
      summary: trackSignup
      description: >-
        Legacy signup tracking with refcode without cookie. Not a resolve/preview operation. Cannot award the
        first-payment server scenario and must not be called before purchase to attach a discount.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        description: JSON only; maximum 256 KiB. No bank secrets or raw bank documents.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupTrackingRequest"
      responses:
        "200":
          description: Validated native result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyTrackingResponse"
        "400":
          description: Invalid body or contract version
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "401":
          description: API key required or invalid
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "403":
          description: Organization/product/program/operation scope denied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "404":
          description: Code not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "409":
          description: First-purchase, self-referral, or immutable order conflict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "413":
          description: Body exceeds 256 KiB
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "415":
          description: JSON content type required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "422":
          description: Inactive code or conditions/activation gates not satisfied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "429":
          description: Native service-key quota exceeded; Retry-After applies
          headers:
