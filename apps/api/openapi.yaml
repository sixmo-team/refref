                  - $ref: "#/components/schemas/NativeHttpError"
        "500":
          description: Native unexpected server or serialization error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
                  - $ref: "#/components/schemas/NativeHttpError"
        "503":
          description: Referral service unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReferralError"
