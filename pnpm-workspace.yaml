packages:
  - "apps/*"
  - "!apps/www"
  - "packages/*"

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# These optional Better Auth peers are CLI/test tools, not application runtime dependencies.
overrides:
  "better-auth>drizzle-kit": "-"
  "better-auth>vitest": "-"
  "happy-dom": "^20.8.9"
  "@esbuild-kit/core-utils>esbuild": "^0.25.12"
  "minimatch@3": "^3.1.4"
  "ajv@6": "^6.14.0"
  "lodash": "^4.18.0"
  "webpack@5": "^5.112.0"
